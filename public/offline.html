<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#a3262a" />
    <title>Offline · Gobble Gobble</title>
    <style>
      html {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        font-family: "Fredoka", ui-rounded, system-ui, sans-serif;
        color: #3d2314;
        background-color: #fdf3dc;
        background-image:
          linear-gradient(90deg, rgb(226 112 42 / 0.16) 50%, transparent 50%),
          linear-gradient(rgb(226 112 42 / 0.16) 50%, transparent 50%);
        background-size: 56px 56px;
      }
      main {
        max-width: 24rem;
        text-align: center;
        background: #fdf3dc;
        border: 3px solid #3d2314;
        border-radius: 1.25rem;
        box-shadow: 6px 6px 0 0 #3d2314;
        padding: 2rem 1.5rem;
      }
      img {
        width: 9rem;
        height: auto;
      }
      h1 {
        font-family: "Lobster", "Brush Script MT", cursive;
        color: #a3262a;
        font-size: 2.25rem;
        margin: 0.5rem 0;
        text-shadow:
          2px 2px 0 #f0b23b,
          4px 4px 0 #3d2314;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fdf3dc;
        background: #a3262a;
        border: 3px solid #3d2314;
        border-radius: 999px;
        box-shadow: 3px 3px 0 0 #3d2314;
        padding: 0.6rem 1.4rem;
        cursor: pointer;
      }
      button:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 0 #3d2314;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/turkey.svg" alt="" />
      <h1>No signal!</h1>
      <p>
        The turkey can't reach the kitchen right now. Check your connection and
        try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
